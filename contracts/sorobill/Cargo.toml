[package]
name = "sorobill"
version = "0.2.1"
edition = "2021"
description = "Decentralized subscription payment protocol on Stellar Soroban"
license = "MIT"
repository = "https://github.com/Sorobill/Sorobill-Contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "23.0.2" }

[dev-dependencies]
soroban-sdk = { version = "23.0.2", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
